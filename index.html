<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-3543643898299039">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="영화와 드라마 작품에 대한 나만의 질문과 답변을 기록하는 마법 같은 서재, 마법사의 서고">
    <title>마법사의 서고</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.9/kakao.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Nanum+Brush+Script&display=swap');

        :root {
            --ancient-gold: #c5a059;
            --stone-medium: #1a1a1f;
            --stone-dark: #0a0a0c;
            --leather-rich: #3d2b1f;
            --parchment: #f2e8cf;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            background: radial-gradient(circle at center, #1a1a24 0%, #08080a 100%);
            color: #e2e2e2;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. 배경 거대 책 더미 */
        .library-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.5;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 0;
            pointer-events: none;
        }

        .book-stack {
            width: 130px;
            display: flex;
            flex-direction: column-reverse;
            margin: 0 -20px; 
        }

        .bg-book {
            height: 12px;
            margin-bottom: 2px;
            background: #1e1e24;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            border-left: 8px solid rgba(0,0,0,0.5); 
            width: 100%;
            border-radius: 1px;
        }

        /* 2. 고대 도서관 채광 및 마법 효과 */
        .god-rays {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -5%, rgba(197, 160, 89, 0.25) 0%, transparent 85%);
            pointer-events: none;
            z-index: 1;
        }

        .magic-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 100px 100px;
            opacity: 0.1;
            animation: moveDust 45s linear infinite;
            z-index: 0;
        }

        @keyframes moveDust {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        /* 3. 3단 선반 레이아웃 */
        .shelf-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-bottom: 80px;
        }

        .shelf-row {
            position: relative;
            padding: 0 20px;
        }

        .books-wrapper {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            min-height: 240px;
            padding-bottom: 2px;
            flex-wrap: nowrap;
            overflow-x: visible;
        }

        .stone-stair {
            height: 28px;
            background: linear-gradient(to bottom, #32323a, #08080a);
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
        }

        /* 4. 마도서(Grimoire) 디자인 */
        .grimoire {
            /* 너비는 JS에서 동적으로 설정 */
            height: 190px;
            position: relative;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-style: preserve-3d;
            border-radius: 3px 6px 6px 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-lr;
            text-orientation: upright;
            direction: ltr;
            font-family: 'Nanum Brush Script', cursive;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            box-shadow: -10px 10px 25px rgba(0,0,0,0.7);
            border-left: 6px solid rgba(0,0,0,0.3);
            flex-shrink: 0;
            text-align: center;
            word-break: keep-all;
            line-height: 1.4;
        }

        .grimoire::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            background: linear-gradient(to bottom, 
                transparent 15%, rgba(0,0,0,0.3) 15.5%, rgba(0,0,0,0.3) 17%, transparent 17.5%,
                transparent 45%, rgba(0,0,0,0.4) 45.5%, rgba(0,0,0,0.4) 47%, transparent 47.5%,
                transparent 80%, rgba(0,0,0,0.4) 80.5%, rgba(0,0,0,0.4) 82%, transparent 82.5%
            );
        }

        .grimoire-decoration {
            position: absolute;
            top: 10px; bottom: 10px; left: 10px; right: 10px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            pointer-events: none;
        }

        .grimoire:hover {
            transform: translateY(-30px) rotateY(-15deg) scale(1.1);
            filter: brightness(1.2);
            box-shadow: 20px 20px 40px rgba(0,0,0,0.9);
            z-index: 50;
        }

        .grimoire-add {
            width: 60px;
            background: rgba(197, 160, 89, 0.05);
            border: 2px dashed rgba(197, 160, 89, 0.2);
            color: var(--ancient-gold);
            font-family: 'serif';
            font-size: 1.8rem;
            writing-mode: horizontal-tb;
            box-shadow: none;
        }

        /* 책 추가 애니메이션 */
        .book-appear {
            animation: bookAppear 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes bookAppear {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
                filter: brightness(1.5);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        /* 5. 3D 북 모달 */
        .book-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(25px);
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            perspective: 2000px;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .open-book {
            width: 100%;
            max-width: 900px;
            height: 80vh;
            max-height: 600px;
            display: flex;
            position: relative;
            transform-style: preserve-3d;
            animation: bookUnfold 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
        }

        @keyframes bookUnfold {
            0% { transform: scale(0.8) rotateY(-45deg); opacity: 0; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        .book-page {
            flex: 1;
            background: #e8dec9;
            color: #2d241e;
            padding: 25px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .page-left {
            border-radius: 10px 0 0 10px;
            border-right: 1px solid rgba(0,0,0,0.1);
            background-image: linear-gradient(to right, #d4c4a8, #e8dec9 15%);
        }

        .page-right {
            border-radius: 0 10px 10px 0;
            background-image: linear-gradient(to left, #d4c4a8, #e8dec9 15%);
        }

        .book-binding {
            position: absolute;
            left: 50%; top: 0; bottom: 0;
            width: 30px;
            background: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.2));
            transform: translateX(-50%);
            z-index: 10;
        }

        /* 6. 모바일 대응 */
        @media (max-width: 768px) {
            .open-book {
                flex-direction: column;
                height: 90vh;
                max-height: none;
            }
            .book-binding {
                width: 100%;
                height: 20px;
                left: 0; top: 50%;
                transform: translateY(-50%);
                background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.1));
            }
            .page-left { border-radius: 10px 10px 0 0; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.1); }
            .page-right { border-radius: 0 0 10px 10px; }
            .grimoire { height: 160px; font-size: 1rem; }
            .books-wrapper { gap: 5px; }
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            body { padding: 0.75rem; padding-top: 1rem; }
            main { padding: 0 0.5rem; }
            .shelf-container { gap: 24px; margin-bottom: 48px; }
            .shelf-row { padding: 0 8px; }
            .books-wrapper { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
            .books-wrapper::-webkit-scrollbar { height: 4px; }
            .stone-stair { height: 20px; }
            .book-page { padding: 16px; }
            #book-title { font-size: 1.25rem; margin-bottom: 1rem; }
            #q-text { font-size: 0.95rem; padding-left: 1rem; }
            .mana-input { padding: 8px; font-size: 14px; min-height: 80px; }
            .a-radio-option { padding: 12px 14px; }
            .a-radio-option span { font-size: 14px; }
            .ancient-slab { padding: 24px 20px; max-height: 85vh; }
            .search-result-item { flex-direction: column; gap: 12px; padding: 12px; }
            .search-result-poster, .search-result-poster-placeholder { width: 100%; height: auto; aspect-ratio: 2/3; max-width: 120px; margin: 0 auto; }
        }
        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            main > div:first-child { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
            main > div:first-child h3 { font-size: 0.9rem; letter-spacing: 0.1em; }
            .gold-btn { padding: 6px 12px; font-size: 9px; }
            .open-book { padding: 0 12px; }
            #book-modal .flex.justify-end.gap-2.flex-wrap { flex-direction: column; }
            #book-modal .flex.justify-end.gap-2.flex-wrap .gold-btn { width: 100%; }
            #tmdb-search-modal .flex.gap-2 { flex-direction: column; }
            #tmdb-search-btn { width: 100%; }
        }

        .gold-btn {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--ancient-gold);
            color: var(--ancient-gold);
            padding: 8px 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .gold-btn:hover:not(:disabled) {
            background: var(--ancient-gold);
            color: #000;
            box-shadow: 0 0 20px var(--ancient-gold);
        }

        .gold-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mana-input {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(54, 36, 26, 0.2);
            border-radius: 4px;
            color: #2d241e;
            padding: 10px;
            width: 100%;
            font-family: 'serif';
            resize: none;
            outline: none;
        }

        .mana-input:disabled {
            background: rgba(0, 0, 0, 0.02);
            color: rgba(45, 36, 30, 0.4);
            cursor: not-allowed;
        }

        .a-radio-wrap {
            display: none;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .a-radio-wrap.visible { display: flex; }
        .a-radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(54, 36, 26, 0.15);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            border-left: 3px solid transparent;
        }
        .a-radio-option:hover {
            background: rgba(197, 160, 89, 0.06);
            border-color: rgba(197, 160, 89, 0.3);
        }
        .a-radio-option.checked {
            background: rgba(197, 160, 89, 0.08);
            border-left-color: var(--ancient-gold);
            box-shadow: 0 0 0 1px rgba(197, 160, 89, 0.2);
        }
        .a-radio-option input {
            width: 20px;
            height: 20px;
            accent-color: var(--ancient-gold);
            cursor: pointer;
            flex-shrink: 0;
        }
        .a-radio-option span {
            color: #2d241e;
            font-size: 15px;
            line-height: 1.5;
            flex: 1;
        }
        .a-radio-option.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 작품 추가 모달 */
        .modal-blur {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(20px);
            background: rgba(0,0,0,0.85);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ancient-slab {
            background: rgba(20, 20, 28, 0.95);
            border: 1px solid var(--ancient-gold);
            box-shadow: 0 30px 60px rgba(0,0,0,1);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* TMDB 검색 결과 스타일 */
        .search-result-item {
            display: flex;
            gap: 16px;
            padding: 16px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(197, 160, 89, 0.2);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-result-item:hover {
            background: rgba(197, 160, 89, 0.1);
            border-color: var(--ancient-gold);
            transform: translateX(4px);
        }

        .search-result-poster {
            width: 96px;
            height: 144px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .search-result-poster-placeholder {
            width: 96px;
            height: 144px;
            background: rgba(197, 160, 89, 0.1);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(197, 160, 89, 0.4);
            font-size: 12px;
            flex-shrink: 0;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* 새 질문 연성 로딩 오버레이 */
        #conjure-loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        #conjure-loading-overlay.visible {
            display: flex;
        }
        .conjure-loading-text {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--ancient-gold);
            letter-spacing: 0.15em;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
            animation: conjurePulse 1.5s ease-in-out infinite;
        }
        .conjure-loading-dots {
            display: flex;
            gap: 6px;
        }
        .conjure-loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--ancient-gold);
            border-radius: 50%;
            animation: conjureBounce 0.6s ease-in-out infinite;
        }
        .conjure-loading-dots span:nth-child(2) { animation-delay: 0.1s; }
        .conjure-loading-dots span:nth-child(3) { animation-delay: 0.2s; }
        @keyframes conjurePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes conjureBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 공유용 카드 (html2canvas 캡처 대상) - 화면 안에서 렌더링해야 전체 캡처됨 */
        .share-card-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: visible;
            pointer-events: none;
        }
        .share-card {
            width: 600px;
            padding: 32px 40px;
            background: linear-gradient(to bottom, #e8dec9, #d4c4a8);
            color: #2d241e;
            font-family: 'Noto Serif KR', serif;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(54, 36, 26, 0.15);
            overflow: visible;
        }
        .share-card-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid rgba(197, 160, 89, 0.5); }
        .share-card-q { font-size: 15px; font-weight: bold; color: #4a342e; margin-bottom: 12px; line-height: 1.5; }
        .share-card-a { font-size: 14px; line-height: 1.6; color: #36241a; white-space: pre-wrap; word-break: break-word; overflow: visible; }
        .share-card-brand { margin-top: 20px; font-size: 11px; color: rgba(54, 36, 26, 0.6); letter-spacing: 0.1em; }
    </style>
</head>
<body class="p-4 md:p-10 pt-10">
    <div class="library-bg" id="bg-stacks"></div>
    <div class="god-rays"></div>
    <div class="magic-dust"></div>

    <main class="max-w-6xl mx-auto relative z-10">
        <!-- 상단 정보 헤더 -->
        <div class="flex flex-wrap items-center justify-between gap-6 mb-12 px-4">
            <div class="flex items-center gap-6">
                <span class="text-4xl opacity-50">📜</span>
                <h3 class="text-xl md:text-2xl font-bold tracking-[0.2em] text-stone-400 uppercase">마법사의 서고</h3>
                <span id="book-count" class="text-[10px] bg-stone-900 text-stone-500 px-3 py-1 border border-stone-800 font-bold uppercase tracking-widest">Volumes: 0</span>
            </div>
            <div class="flex gap-2">
                <a id="shared-library-link" href="/share.html" class="gold-btn text-[10px] tracking-widest px-4 py-2 no-underline" title="다른 사람들이 공유한 책 보기">📚 공유된 서고</a>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdh7hu20jRqcRAAGs0klcdO0mKaGnw2MDd7GmVI3I4uiJBb-A/viewform" target="_blank" rel="noopener noreferrer" class="gold-btn text-[10px] tracking-widest px-4 py-2 no-underline" title="개선사항·에러 피드백 보내기">💬 피드백</a>
                <button id="site-share-btn" type="button" onclick="shareSiteFeed()" class="gold-btn text-[10px] tracking-widest px-4 py-2" title="사이트를 카카오톡으로 공유">📤 사이트 공유</button>
            </div>
        </div>

        <!-- 3단 서재 선반 구역 -->
        <div class="shelf-container">
            <div class="shelf-row">
                <div id="shelf-1" class="books-wrapper">
                    <div id="add-work-btn" class="grimoire grimoire-add" onclick="openTmdbSearchModal()" title="새로운 마법 기록 연성">+</div>
                </div>
                <div class="stone-stair"></div>
            </div>
            <div class="shelf-row">
                <div id="shelf-2" class="books-wrapper"></div>
                <div class="stone-stair"></div>
            </div>
            <div class="shelf-row">
                <div id="shelf-3" class="books-wrapper"></div>
                <div class="stone-stair"></div>
            </div>
        </div>
    </main>

    <!-- 마도서 펼치기 모달 -->
    <div id="book-modal" class="book-overlay" onclick="closeGrimoire()">
        <div class="open-book" onclick="event.stopPropagation()">
            <div class="book-binding"></div>
            <div class="book-page page-left flex flex-col">
                <h3 id="book-title" class="text-2xl md:text-3xl font-bold mb-6 font-serif text-[#36241a] border-b border-[#36241a]/10 pb-4">작품명</h3>
                <div class="flex-1 flex flex-col justify-center">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-[#36241a]/40 font-bold mb-4 italic">The Sealed Question</div>
                    <div class="relative group">
                        <div id="q-text" class="text-lg font-bold border-l-4 border-[#c5a059]/50 pl-6 py-2 italic text-[#4a342e] pr-12">질문이 표시됩니다.</div>
                        <button 
                            id="q-delete-btn"
                            onclick="deleteCurrentQuestion()" 
                            class="absolute top-2 right-2 opacity-70 hover:opacity-100 transition-opacity text-[#36241a]/60 hover:text-red-600 text-xl font-bold p-1 rounded hover:bg-red-50"
                            title="질문 삭제"
                        >
                            ×
                        </button>
                    </div>
                </div>
                <div class="mt-8 flex items-center justify-between gap-2 flex-wrap">
                    <div class="flex gap-2">
                        <button onclick="prevQuestion()" class="p-2 border border-[#36241a]/20 hover:bg-[#36241a]/5 rounded">◀</button>
                        <span id="q-index" class="text-[10px] font-bold text-[#36241a]/50 flex items-center px-1">1 / 1</span>
                        <button onclick="nextQuestion()" class="p-2 border border-[#36241a]/20 hover:bg-[#36241a]/5 rounded">▶</button>
                    </div>
                    <div class="flex gap-2 ml-auto">
                        <button onclick="addCustomQuestion()" class="gold-btn text-[10px] px-3 py-2">✍️ 질문 직접 연성</button>
                        <button id="conjure-question-btn" onclick="conjureNewQuestion()" class="gold-btn text-[10px] px-3 py-2">✨ 새 질문 연성</button>
                    </div>
                </div>

            <div class="book-page page-right flex flex-col">
                <div class="absolute top-4 right-6 text-3xl cursor-pointer opacity-30 hover:opacity-100" onclick="closeGrimoire()">×</div>
                <div class="flex-1 flex flex-col mt-8">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-[#36241a]/40 font-bold mb-4 italic">My Arcane Record</div>
                    <div id="a-container" class="flex-1 flex flex-col min-h-0">
                        <textarea id="a-input" class="mana-input flex-1" placeholder="당신의 통찰을 이곳에 봉인하십시오..."></textarea>

                <div class="mt-2 flex justify-end">
                    <button type="button" id="share-book-btn" onclick="shareBookToKV()" class="gold-btn text-[10px] px-4 py-2" title="책 전체를 공유 기록에 저장">📚 다른 사람한테 보여주기</button>
                </div>
                <div class="mt-4 pt-4 border-t border-[#36241a]/5 flex justify-between items-center text-[9px] text-[#36241a]/40 font-bold tracking-[0.2em] uppercase">
                    <span>Fragment #ARC-9</span>

    <!-- TMDB 검색 모달 -->
    <div id="tmdb-search-modal" class="modal-blur" onclick="closeTmdbSearchModal()">
        <div class="ancient-slab" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-yellow-600 tracking-widest uppercase">Seal New Record</h3>
                <button onclick="closeTmdbSearchModal()" class="text-2xl text-stone-600 hover:text-stone-400 cursor-pointer">×</button>
            </div>
            
            <div class="flex gap-2 mb-6">
                <input
                    type="text"
                    id="tmdb-search-input"
                    placeholder="작품명 검색 (예: 프리렌, 귀멸)"
                    class="flex-1 rounded-lg bg-black/40 border border-stone-800 px-4 py-3 focus:outline-none focus:border-yellow-900/50 text-stone-200 placeholder-stone-600"
                    autocomplete="off"
                />
                <button
                    id="tmdb-search-btn"
                    onclick="doTmdbSearch()"
                    class="gold-btn px-6 py-3 text-xs tracking-widest"
                >
                    검색
                </button>
            </div>

            <div id="tmdb-search-status" class="mb-4 text-stone-400 text-sm min-h-[1.5rem]"></div>
            <div id="tmdb-search-results" class="scrollbar-hide" style="max-height: 60vh; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- 새 질문 연성 로딩 오버레이 -->
    <div id="conjure-loading-overlay">
        <div class="conjure-loading-text">마법으로 질문 생성하는 중</div>
        <div class="conjure-loading-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <script>
        const apiKey = "";
        const API_BASE = window.location.origin;
        const DEBUG_LOGS = new URLSearchParams(window.location.search).get("debug") === "1"
            || localStorage.getItem("magic_house_debug") === "1";
        let featureAvailability = {
            tmdbSearch: true,
            aiQuestions: true,
            kakaoShare: true,
            kakaoLogin: true,
            sharedRecords: true
        };

        function debugLog(...args) {
            if (DEBUG_LOGS) {
                console.log(...args);
            }
        }

        function setButtonAvailability(elementId, enabled, disabledTitle) {
            const element = document.getElementById(elementId);
            if (!element) return;

            const isLink = element.tagName === "A";
            if (isLink) {
                element.style.pointerEvents = enabled ? "" : "none";
                element.style.opacity = enabled ? "" : "0.5";
                element.setAttribute("aria-disabled", enabled ? "false" : "true");
            } else {
                element.disabled = !enabled;
                element.style.opacity = enabled ? "" : "0.5";
            }

            if (!element.dataset.originalTitle) {
                element.dataset.originalTitle = element.title || "";
            }
            element.title = enabled ? element.dataset.originalTitle : disabledTitle;
        }

        function applyFeatureAvailability(features = {}) {
            featureAvailability = {
                ...featureAvailability,
                ...features
            };

            setButtonAvailability("add-work-btn", featureAvailability.tmdbSearch, "TMDB API 키가 설정되지 않아 작품 검색을 사용할 수 없습니다.");
            setButtonAvailability("conjure-question-btn", featureAvailability.aiQuestions, "OpenAI API 키가 설정되지 않아 AI 질문 생성을 사용할 수 없습니다.");
            setButtonAvailability("site-share-btn", featureAvailability.kakaoShare, "KAKAO_JS_KEY가 설정되지 않아 카카오 공유를 사용할 수 없습니다.");
            setButtonAvailability("share-qa-btn", featureAvailability.kakaoShare, "KAKAO_JS_KEY가 설정되지 않아 카카오 공유를 사용할 수 없습니다.");
            setButtonAvailability(
                "share-book-btn",
                featureAvailability.kakaoLogin && featureAvailability.sharedRecords,
                !featureAvailability.kakaoLogin
                    ? "카카오 로그인 설정이 없어 공유 저장을 사용할 수 없습니다."
                    : "KV 저장소 설정이 없어 공유 저장을 사용할 수 없습니다."
            );
            setButtonAvailability("shared-library-link", featureAvailability.sharedRecords, "KV 저장소 설정이 없어 공유된 서고를 볼 수 없습니다.");
        }
        const IMAGE_BASE = "https://image.tmdb.org/t/p/w500";
        
        const STORAGE_KEY = "arcane_archive";
        
        // 초기 데이터 (빈 상태로 시작)
        let archiveData = {}; // { title: [{ q, a }, ...] }
        let workMetadata = {}; // { title: { overview: "" } } - 작품 메타데이터
        
        let currentOpenAnime = "";

        function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data && typeof data.archiveData === "object") {
                        archiveData = data.archiveData || {};
                    }
                    if (data && typeof data.workMetadata === "object") {
                        workMetadata = data.workMetadata || {};
                    }
                }
            } catch (e) {
                console.warn("로컬 스토리지 로드 실패:", e);
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    archiveData,
                    workMetadata
                }));
            } catch (e) {
                console.warn("로컬 스토리지 저장 실패:", e);
            }
        }
        let currentQIndex = 0;
        let currentSearchResults = [];

        function createBgStacks() {
            const container = document.getElementById('bg-stacks');
            if(!container) return;
            const stackCount = 14; 
            for(let i = 0; i < stackCount; i++) {
                const stack = document.createElement('div');
                stack.className = 'book-stack';
                const height = Math.floor(Math.random() * 30) + 15; 
                for(let j = 0; j < height; j++) {
                    const book = document.createElement('div');
                    book.className = 'bg-book';
                    book.style.width = (75 + Math.random() * 45) + '%';
                    const hue = 210 + Math.random() * 40;
                    book.style.backgroundColor = `hsl(${hue}, 15%, ${12 + Math.random() * 15}%)`;
                    stack.appendChild(book);
                }
                container.appendChild(stack);
            }
        }

        // 초기 서재 채우기 (왼쪽 위부터 순서대로)
        function initLibrary() {
            const titles = Object.keys(archiveData);
            titles.forEach((title) => {
                addBookToNextAvailableShelf(title);
            });
            updateVolumeCount();
        }

        // archiveData 구조 호환성 함수: 기존 배열 형태를 새로운 구조로 변환
        function getQuestionsForTitle(title) {
            if (!archiveData[title]) return [];
            // 기존 배열 형태인지 확인
            if (Array.isArray(archiveData[title])) {
                return archiveData[title];
            }
            // 새로운 구조인 경우
            return archiveData[title].questions || [];
        }

        function getOverviewForTitle(title) {
            return workMetadata[title]?.overview || "";
        }

        // 질문 수에 따른 책 두께 계산 (기본 60px + 질문당 6px)
        const BASE_BOOK_WIDTH = 60;
        const QUESTION_WIDTH_INCREMENT = 6;
        function getBookWidthForTitle(title) {
            const count = getQuestionsForTitle(title).length;
            return BASE_BOOK_WIDTH + count * QUESTION_WIDTH_INCREMENT;
        }

        // 해당 제목의 책 DOM 요소 찾아 두께 업데이트
        function updateBookWidthForTitle(title) {
            const books = document.querySelectorAll('.grimoire:not(.grimoire-add)');
            for (const book of books) {
                const text = book.textContent?.trim() || '';
                if (text === title) {
                    book.style.width = `${getBookWidthForTitle(title)}px`;
                    break;
                }
            }
        }

        // 기본 질문인지 확인하는 함수
        function isDefaultQuestion(questionText, title) {
            if (!questionText || !title) return false;
            const defaultPattern = `'${title}'에 대한 첫 번째 기록을 시작하십시오.`;
            return questionText.trim() === defaultPattern;
        }

        // 선반의 사용 가능한 너비 계산
        function getShelfAvailableWidth(shelfId) {
            const shelf = document.getElementById(shelfId);
            if (!shelf) return 0;
            
            const shelfWidth = shelf.offsetWidth;
            const books = shelf.querySelectorAll('.grimoire:not(.grimoire-add)');
            const addButton = shelf.querySelector('.grimoire-add');
            
            let booksTotalWidth = 0;
            books.forEach(book => {
                booksTotalWidth += book.offsetWidth;
            });
            
            const gap = 6; // CSS에서 설정된 gap 값
            // gap은 요소들 사이에만 있으므로 (요소 개수 - 1)개
            const totalElements = books.length + (addButton ? 1 : 0);
            const gapTotal = totalElements > 0 ? gap * (totalElements - 1) : 0;
            const addButtonWidth = addButton ? 60 : 0; // 플러스 버튼 너비
            
            return shelfWidth - booksTotalWidth - gapTotal - addButtonWidth;
        }

        // 선반이 가득 찼는지 확인
        function isShelfFull(shelfId, newBookWidth) {
            const availableWidth = getShelfAvailableWidth(shelfId);
            return availableWidth < newBookWidth;
        }

        // 다음 사용 가능한 선반에 책 추가하는 함수
        function addBookToNextAvailableShelf(title) {
            const bookWidth = getBookWidthForTitle(title);
            
            // 플러스 버튼이 있는 선반 찾기
            let addButton = document.querySelector('.grimoire-add');
            let currentShelf = addButton ? addButton.closest('.books-wrapper') : null;
            
            if (!currentShelf) {
                // 플러스 버튼이 없으면 shelf-1에 추가
                createGrimoireElement(title, 'shelf-1');
                return;
            }

            const shelfId = currentShelf.id;
            
            // 현재 선반이 가득 찼는지 확인
            if (isShelfFull(shelfId, bookWidth)) {
                // 가득 찼으면 다음 선반으로 플러스 버튼 이동
                moveAddButtonToNextShelf();
                // 이동한 후 다시 선반 찾기
                addButton = document.querySelector('.grimoire-add');
                currentShelf = addButton ? addButton.closest('.books-wrapper') : null;
                if (currentShelf) {
                    createGrimoireElement(title, currentShelf.id);
                } else {
                    // 더 이상 선반이 없으면 shelf-1에 추가
                    createGrimoireElement(title, 'shelf-1');
                }
            } else {
                // 공간이 있으면 현재 선반에 추가
                createGrimoireElement(title, shelfId);
            }
        }

        function createGrimoireElement(title, shelfId) {
            const shelf = document.getElementById(shelfId);
            const addButton = shelf.querySelector('.grimoire-add');
            
            const colors = ['#4e1a1a', '#1a2b4a', '#1b3b2a', '#5d4037', '#281b3d', '#1c1c1c', '#3e2723', '#2c3e50'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const fixedHeight = 190; // 고정 높이 사용
            const fixedWidth = getBookWidthForTitle(title); // 질문 수에 따른 두께

            const newBook = document.createElement('div');
            newBook.className = 'grimoire book-appear';
            newBook.style.backgroundColor = randomColor;
            newBook.style.height = `${fixedHeight}px`;
            newBook.style.width = `${fixedWidth}px`;
            newBook.innerHTML = `<div class="grimoire-decoration"></div>${title}`;
            newBook.onclick = () => openGrimoire(title);

            // 선반이 가득 찼는지 확인 (플러스 버튼이 없는 경우)
            if (!addButton) {
                // 플러스 버튼이 없으면 다음 선반으로 이동해야 함
                shelf.appendChild(newBook);
                moveAddButtonToNextShelf();
                return;
            }

            // 플러스 버튼이 있으면 임시로 제거하고, 새 책을 추가한 후 플러스 버튼을 마지막으로 이동
            addButton.remove();
            shelf.appendChild(newBook);
            
            // 새 책 추가 후 플러스 버튼을 다시 추가
            shelf.appendChild(addButton);
        }

        // 플러스 버튼을 다음 선반으로 이동하는 함수
        function moveAddButtonToNextShelf() {
            const addButton = document.querySelector('.grimoire-add');
            if (!addButton) return;

            const currentShelf = addButton.closest('.books-wrapper');
            const currentShelfId = currentShelf ? currentShelf.id : null;

            if (currentShelfId === 'shelf-1') {
                // shelf-1에서 shelf-2로 이동
                addButton.remove();
                document.getElementById('shelf-2').appendChild(addButton);
            } else if (currentShelfId === 'shelf-2') {
                // shelf-2에서 shelf-3으로 이동
                addButton.remove();
                document.getElementById('shelf-3').appendChild(addButton);
            }
            // shelf-3이면 그대로 유지
        }
        
        window.onload = function() {
            loadFromLocalStorage();
            createBgStacks();
            initLibrary();
        };

        async function openGrimoire(title) {
            currentOpenAnime = title;
            if (!archiveData[title]) {
                archiveData[title] = [{ q: `'${title}'에 대한 첫 번째 기록을 시작하십시오.`, a: "" }];
            }
            const questions = getQuestionsForTitle(title);
            currentQIndex = questions.length - 1;
            document.getElementById('book-title').innerText = title;
            updatePageContent();
            
            // 공유 상태 확인 및 버튼 텍스트 업데이트
            const shareBtn = document.getElementById("share-book-btn");
            if (shareBtn) {
                try {
                    const existingRecord = await getBookSharedRecord(title);
                    if (existingRecord) {
                        shareBtn.textContent = "📚 공유 취소";
                    } else {
                        shareBtn.textContent = "📚 다른 사람한테 보여주기";
                    }
                } catch (err) {
                    // 에러가 나도 기본 텍스트로 설정
                    shareBtn.textContent = "📚 다른 사람한테 보여주기";
                }
            }
            
            document.getElementById('book-modal').style.display = 'flex';
        }

        function saveAndCloseGrimoire() {
            saveCurrentAnswer();
            saveToLocalStorage();
            const questions = getQuestionsForTitle(currentOpenAnime);
            const hasNext = currentQIndex < questions.length - 1;
            if (hasNext) {
                currentQIndex++;
                updatePageContent();
            } else {
                alert("마지막 질문입니다.");
                document.getElementById('book-modal').style.display = 'none';
            }
        }

        function closeGrimoire() {
            if (confirm("저장하시겠습니까?")) {
                saveCurrentAnswer();
                saveToLocalStorage();
            }
            document.getElementById('book-modal').style.display = 'none';
        }

        function updatePageContent() {
            const questions = getQuestionsForTitle(currentOpenAnime);
            const hasQuestions = questions && questions.length > 0;
            
            const textarea = document.getElementById('a-input');
            const radioWrap = document.getElementById('a-radio-wrap');
            const saveBtn = document.getElementById('save-answer-btn');
            
            if (!hasQuestions) {
                // 질문이 없을 때 비활성화
                document.getElementById('q-text').innerText = "질문이 없습니다. 새 사유를 연성하십시오.";
                textarea.value = "";
                document.getElementById('q-index').innerText = "0 / 0";
                textarea.style.display = "";
                textarea.disabled = true;
                if (radioWrap) { radioWrap.classList.remove("visible"); radioWrap.innerHTML = ""; }
                if (saveBtn) saveBtn.disabled = true;
                return;
            }
            
            // 질문이 있을 때
            const item = questions[currentQIndex];
            const isDefault = isDefaultQuestion(item.q, currentOpenAnime);
            const hasOptions = item.options && Array.isArray(item.options) && item.options.length > 0;
            
            document.getElementById('q-text').innerText = item.q;
            document.getElementById('q-index').innerText = `${currentQIndex + 1} / ${questions.length}`;
            
            if (hasOptions) {
                textarea.style.display = "none";
                textarea.disabled = true;
                radioWrap.classList.add("visible");
                radioWrap.innerHTML = "";
                const savedVal = item.a || "";
                item.options.forEach((opt) => {
                    const val = String(opt);
                    const label = document.createElement("label");
                    label.className = "a-radio-option" + (savedVal === val ? " checked" : "") + (isDefault ? " disabled" : "");
                    const input = document.createElement("input");
                    input.type = "radio";
                    input.name = "a-radio-choice";
                    input.value = val;
                    input.checked = savedVal === val;
                    input.disabled = isDefault;
                    input.addEventListener("change", function() {
                        radioWrap.querySelectorAll(".a-radio-option").forEach((l) => l.classList.remove("checked"));
                        label.classList.add("checked");
                    });
                    const span = document.createElement("span");
                    span.textContent = val;
                    label.appendChild(input);
                    label.appendChild(span);
                    radioWrap.appendChild(label);
                });
            } else {
                textarea.style.display = "";
                textarea.disabled = isDefault;
                textarea.value = item.a || "";
                radioWrap.classList.remove("visible");
                radioWrap.innerHTML = "";
            }
            
            if (saveBtn) saveBtn.disabled = isDefault;
        }

        function prevQuestion() { 
            const questions = getQuestionsForTitle(currentOpenAnime);
            if (currentQIndex > 0) { 
                saveCurrentAnswer(); 
                currentQIndex--; 
                updatePageContent(); 
            } 
        }
        function nextQuestion() { 
            const questions = getQuestionsForTitle(currentOpenAnime);
            if (currentQIndex < questions.length - 1) { 
                saveCurrentAnswer(); 
                currentQIndex++; 
                updatePageContent(); 
            } 
        }
        function saveCurrentAnswer() { 
            if (!currentOpenAnime) return;
            const questions = getQuestionsForTitle(currentOpenAnime);
            if (questions[currentQIndex]) {
                // 기본 질문일 때는 저장하지 않음
                const isDefault = isDefaultQuestion(questions[currentQIndex].q, currentOpenAnime);
                if (isDefault) return;
                
                const item = questions[currentQIndex];
                const hasOptions = item.options && Array.isArray(item.options) && item.options.length > 0;
                if (hasOptions) {
                    const checked = document.querySelector('#a-radio-wrap input[name="a-radio-choice"]:checked');
                    item.a = checked ? checked.value : "";
                } else {
                    item.a = document.getElementById('a-input').value;
                }
            }
        }

        function addCustomQuestion() {
            saveCurrentAnswer();
            if (!currentOpenAnime) return;
            const q = (prompt("추가할 질문을 입력하세요.") || "").trim();
            if (!q) return;
            const questions = getQuestionsForTitle(currentOpenAnime);
            const defaultIndex = questions.findIndex((item) => isDefaultQuestion(item.q, currentOpenAnime));
            if (defaultIndex !== -1) {
                questions.splice(defaultIndex, 1);
            }
            const newIndex = questions.length;
            questions.push({ q: q, a: "" });
            currentQIndex = newIndex;
            updatePageContent();
            updateBookWidthForTitle(currentOpenAnime);
            saveToLocalStorage();
        }

        async function conjureNewQuestion() {
            if (!featureAvailability.aiQuestions) {
                alert("OpenAI API 키가 설정되지 않아 AI 질문 생성을 사용할 수 없습니다.");
                return;
            }

            saveCurrentAnswer();
            
            const btn = event.currentTarget;
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerText = "연성 중...";
            
            const overlay = document.getElementById("conjure-loading-overlay");
            if (overlay) overlay.classList.add("visible");
            
            try {
                // overview 가져오기 (없으면 작품 제목 기반 기본 설명 사용)
                let overview = getOverviewForTitle(currentOpenAnime);
                if (!overview || overview.trim() === "") {
                    overview = `${currentOpenAnime}에 대한 작품입니다.`;
                }

                // 기존 Q&A (기본 질문 제외, 최근 15개 제한)
                const allQuestions = getQuestionsForTitle(currentOpenAnime);
                const existingQA = allQuestions
                    .filter((item) => !isDefaultQuestion(item.q, currentOpenAnime))
                    .slice(-15)
                    .map((item) => ({ q: item.q, a: item.a || "" }));

                const requestBody = {
                    title: currentOpenAnime,
                    overview: overview,
                    existingQA: existingQA
                };

                debugLog("=== Open API 호출 요청 ===");
                debugLog("URL:", `${API_BASE}/api/generate-questions`);
                debugLog("Request Body:", {
                    title: requestBody.title,
                    overviewLength: requestBody.overview.length,
                    existingQaCount: requestBody.existingQA.length
                });

                const res = await fetch(`${API_BASE}/api/generate-questions`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody),
                });
                const data = await res.json();

                debugLog("=== Open API 호출 응답 ===");
                debugLog("Status:", res.status, res.statusText);
                if (data.questions) {
                    debugLog("생성된 질문 개수:", data.questions.length);
                    data.questions.forEach((q, idx) => {
                        debugLog(`질문 ${idx + 1}:`, q);
                    });
                }

                if (!res.ok) {
                    throw new Error(data.error || "질문 생성 실패");
                }

                const newQuestions = data.questions || [];
                if (newQuestions.length === 0) {
                    throw new Error("생성된 질문이 없습니다.");
                }

                // 질문 5개를 archiveData에 추가
                const questions = getQuestionsForTitle(currentOpenAnime);
                
                // 기본 질문이 있으면 삭제
                const defaultIndex = questions.findIndex((item) => isDefaultQuestion(item.q, currentOpenAnime));
                if (defaultIndex !== -1) {
                    questions.splice(defaultIndex, 1);
                }
                
                // 새 질문 추가 (API 응답: { q, options? } 또는 문자열)
                const startIndex = questions.length;
                newQuestions.forEach((item) => {
                    const q = typeof item === "string" ? item.trim() : (item?.q?.trim() || "");
                    const options = typeof item === "object" && Array.isArray(item?.options) ? item.options : undefined;
                    questions.push({ q, a: "", options });
                });
                
                // 생성된 질문 중 첫 번째로 이동
                currentQIndex = startIndex;
                updatePageContent();
                updateBookWidthForTitle(currentOpenAnime);
                saveToLocalStorage();
            } catch (error) {
                console.error("질문 생성 오류:", error);
                alert("질문 생성 중 오류가 발생했습니다: " + error.message);
            } finally {
                if (overlay) overlay.classList.remove("visible");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        function deleteCurrentQuestion() {
            if (!currentOpenAnime) return;
            
            const questions = getQuestionsForTitle(currentOpenAnime);
            if (questions.length === 0) return;
            
            if (!confirm("이 질문을 삭제하면 해당 답변도 함께 삭제됩니다. 삭제하시겠습니까?")) {
                return;
            }
            
            // 현재 답변 저장
            saveCurrentAnswer();
            
            // 현재 질문 삭제
            questions.splice(currentQIndex, 1);
            
            // 질문이 모두 삭제된 경우
            if (questions.length === 0) {
                currentQIndex = 0;
                updatePageContent();
                saveToLocalStorage();
                return;
            }
            
            // 삭제 후 적절한 인덱스로 이동
            // 현재 인덱스가 마지막이었으면 이전 질문으로, 아니면 현재 인덱스 유지 (다음 질문이 앞으로 이동)
            if (currentQIndex >= questions.length) {
                currentQIndex = questions.length - 1;
            }
            
            updatePageContent();
            updateBookWidthForTitle(currentOpenAnime);
            saveToLocalStorage();
        }

        async function doTmdbSearch() {
            const searchInput = document.getElementById('tmdb-search-input');
            const searchBtn = document.getElementById('tmdb-search-btn');
            const resultsEl = document.getElementById('tmdb-search-results');
            const q = searchInput.value.trim();
            
            if (!q) {
                setTmdbStatus("검색어를 입력하세요.");
                return;
            }

            searchBtn.disabled = true;
            setTmdbStatus("대도서관에서 찾고 있습니다…");
            resultsEl.innerHTML = "";

            try {
                const res = await fetch(`${API_BASE}/api/tmdb/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                if (!res.ok) {
                    setTmdbStatus("오류: " + (data.error || data.status_message || res.status), true);
                    return;
                }

                const list = data.results || [];
                if (list.length === 0) {
                    setTmdbStatus("검색 결과가 없습니다.");
                    return;
                }

                setTmdbStatus(`총 ${data.total_results ?? list.length}건 (페이지 ${data.page ?? 1})`);
                currentSearchResults = list;
                resultsEl.innerHTML = list.map((item, index) => renderSearchResult(item, index)).join("");
            } catch (err) {
                setTmdbStatus("요청 실패: " + err.message, true);
            } finally {
                searchBtn.disabled = false;
            }
        }

        // 카카오 로그인 상태 확인
        async function checkKakaoLogin() {

        // 카카오 로그인 실행 (authorize 사용)
        function loginWithKakao() {
            if (!window.Kakao) {
                alert('카카오 SDK가 로드되지 않았습니다.');
                return Promise.reject(new Error('SDK not loaded'));
            }
            
            // SDK 초기화 확인
            if (!window.Kakao.isInitialized()) {
                if (!kakaoJsKey) {
                    alert('카카오 API 키가 설정되지 않았습니다.');
                    return Promise.reject(new Error('API key not set'));
                }
                window.Kakao.init(kakaoJsKey);
            }
            
            // Auth API 사용 가능 여부 확인
            if (!window.Kakao.Auth) {
                alert('카카오 로그인 API를 사용할 수 없습니다. 카카오 개발자 콘솔에서 카카오 로그인을 활성화해주세요.');
                return Promise.reject(new Error('Auth API not available'));
            }
            
            // authorize 메서드 사용 가능 여부 확인
            if (typeof window.Kakao.Auth.authorize !== 'function') {
                console.error('[카카오 로그인] authorize 메서드를 사용할 수 없습니다. 사용 가능한 메서드:', Object.keys(window.Kakao.Auth || {}));
                alert('카카오 로그인 기능을 사용할 수 없습니다. 카카오 개발자 콘솔에서 카카오 로그인을 활성화하고, Redirect URI를 설정해주세요.');
                return Promise.reject(new Error('authorize method not available'));
            }
            
            // authorize는 OAuth 인가 코드 흐름을 사용하므로 페이지 리다이렉트가 발생합니다
            // 인가 코드는 URL 파라미터로 전달되므로, 서버에서 처리하거나 클라이언트에서 처리해야 합니다
            // 간단한 방법: 현재 페이지로 리다이렉트하고 URL에서 코드를 읽어 처리
            
            return new Promise((resolve, reject) => {
                debugLog('[카카오 로그인] authorize 호출...');
                
                // 현재 URL을 redirectUri로 사용
                const redirectUri = window.location.origin + window.location.pathname;
                
                // URL에서 인가 코드 확인 (이미 로그인된 경우)
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                
                if (code) {
                    // 인가 코드가 있으면 서버에서 토큰으로 교환해야 하지만,
                    // 간단하게 하기 위해 authorize를 다시 호출하지 않고
                    // 사용자 정보를 가져오려고 시도
                    debugLog('[카카오 로그인] 인가 코드 발견:', code);
                    // 실제로는 서버에서 토큰으로 교환해야 하지만, 
                    // 여기서는 authorize를 통해 자동으로 처리되도록 함
                    window.Kakao.Auth.authorize({
                        redirectUri: redirectUri,
                        scope: 'profile_nickname,account_email',
                        state: 'login'
                    });
                    // authorize는 페이지를 리다이렉트하므로 Promise는 resolve되지 않음
                    // 대신 페이지 로드 시 URL에서 코드를 확인하여 처리해야 함
                    return;
                }
                
                // 인가 코드가 없으면 authorize 호출
                window.Kakao.Auth.authorize({
                    redirectUri: redirectUri,
                    scope: 'profile_nickname,account_email',
                    state: 'login'
                });
                
                // authorize는 페이지를 리다이렉트하므로 여기서는 reject
                // 실제 로그인 처리는 페이지 로드 시 URL 파라미터를 확인하여 처리
                reject(new Error('authorize는 페이지 리다이렉트를 발생시킵니다.'));
            });
        }

        // 로그인 확인 및 필요시 로그인 팝업
        async function ensureKakaoLogin() {
            if (!window.Kakao || !window.Kakao.Auth) {
                throw new Error('카카오 SDK가 준비되지 않았습니다. 카카오 개발자 콘솔에서 카카오 로그인을 활성화해주세요.');
            }
            
            if (typeof window.Kakao.Auth.authorize !== 'function') {
                throw new Error('카카오 로그인 기능을 사용할 수 없습니다. 카카오 개발자 콘솔에서 카카오 로그인을 활성화하고 Redirect URI를 설정해주세요.\n\n자세한 내용은 KAKAO_LOGIN_SETUP.md 파일을 참고하세요.');
            }
            
            // 이미 로그인되어 있는지 확인
            const savedUserId = localStorage.getItem('kakao_user_id');
            if (savedUserId) {
                kakaoUserId = savedUserId;
                // 토큰 유효성 확인
                try {
                    const isValid = await checkKakaoLogin();
                    if (isValid && kakaoUserId) {
                        return kakaoUserId;
                    }
                } catch (err) {
                    console.warn('[카카오 로그인 확인 실패]', err);
                }
                // 토큰이 유효하지 않으면 localStorage에서 제거하고 다시 로그인
                localStorage.removeItem('kakao_user_id');
                kakaoUserId = null;
            }
            
            // 카카오 로그인은 authorize()를 사용하므로 페이지 리다이렉트가 발생합니다.
            // URL에서 인가 코드 확인
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            
            if (code && state === 'login') {
                // 인가 코드가 있으면 서버에서 토큰으로 교환
                try {
                    const redirectUri = window.location.origin;
                    const tokenRes = await fetch(window.location.origin + "/api/kakao/token", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ code, redirectUri }),
                    });
                    
                    if (!tokenRes.ok) {
                        const errorData = await tokenRes.json().catch(() => ({}));
                        throw new Error('토큰 교환 실패: ' + (errorData.error || tokenRes.statusText));
                    }
                    
                    const tokenData = await tokenRes.json();
                    const accessToken = tokenData.access_token;
                    
                    // 액세스 토큰을 카카오 SDK에 설정
                    if (window.Kakao && window.Kakao.Auth) {
                        window.Kakao.Auth.setAccessToken(accessToken);
                    }
                    
                    // 사용자 정보 조회
                    const userRes = await fetch(window.location.origin + "/api/kakao/user", {
                        headers: { "Authorization": `Bearer ${accessToken}` },
                    });
                    
                    if (!userRes.ok) {
                        throw new Error('사용자 정보 조회 실패');
                    }
                    
                    const userData = await userRes.json();
                    kakaoUserId = userData.id.toString();
                    localStorage.setItem('kakao_user_id', kakaoUserId);
                    
                    // URL에서 인가 코드 제거
                    const newUrl = window.location.origin + window.location.pathname;
                    window.history.replaceState({}, document.title, newUrl);
                    
                    debugLog('[카카오 로그인] 성공, 사용자 ID:', kakaoUserId);
                    return kakaoUserId;
                } catch (err) {
                    console.error('[카카오 로그인] 토큰 교환 실패:', err);
                    throw new Error('카카오 로그인 처리 중 오류가 발생했습니다: ' + err.message);
                }
            }
            
            // authorize()를 사용하여 카카오 로그인 페이지로 리다이렉트
            // Redirect URI는 정확히 일치해야 함 (카카오 개발자 콘솔에 등록된 URI와 동일하게)
            // 슬래시 없이: http://localhost:3000
            const redirectUri = window.location.origin;
            // 동의 항목 없이 사용자 ID만 받기 (닉네임, 프로필 사진 불필요)
            window.Kakao.Auth.authorize({
                redirectUri: redirectUri,
                // scope를 지정하지 않으면 기본 사용자 ID만 받을 수 있음
                // 닉네임, 프로필 사진 등 추가 정보는 필요 없으므로 scope 제거
                state: 'login'
            });
            // authorize는 페이지를 리다이렉트하므로 여기서는 대기
            throw new Error('카카오 로그인 페이지로 이동합니다.');
        }

            if (!kakaoUserId) {
                return null;

            try {
                const res = await fetch(window.location.origin + `/api/shared-records?title=${encodeURIComponent(title)}`);

                    return null;

                const result = await res.json();
                const records = result.records || [];
                
                // 현재 사용자의 "book" 타입 기록만 필터링

                    .filter(r => r.type === "book" && r.userId === kakaoUserId)

                return bookRecord || null;

                console.warn("[공유 기록 조회 실패]", err);
                return null;
            }

        async function shareBookToKV() {
            if (!featureAvailability.kakaoLogin || !featureAvailability.sharedRecords) {
                alert(!featureAvailability.kakaoLogin
                    ? "카카오 로그인 설정이 없어 공유 저장을 사용할 수 없습니다."
                    : "공유 저장소 설정이 없어 공유 저장을 사용할 수 없습니다.");
                return;
            }
            // 0. 카카오 로그인 확인
            try {
                debugLog('[공유 시작] 카카오 로그인 확인 중...');
                const userId = await ensureKakaoLogin();
                debugLog('[공유] 로그인 완료, userId:', userId, 'kakaoUserId:', kakaoUserId);
                
                if (!userId || !kakaoUserId) {
                    console.error('[공유 실패] userId 또는 kakaoUserId가 없습니다.');
                    alert('공유하려면 카카오 로그인이 필요합니다. (사용자 ID 없음)');
                    return;
                }
            } catch (err) {
                console.error('[공유 실패] 로그인 오류:', err);
                const errorMsg = err.message || String(err);
                if (errorMsg.includes('카카오 개발자 콘솔') || errorMsg.includes('KOE004')) {
                    alert('공유하려면 카카오 로그인이 필요합니다.\n\n카카오 개발자 콘솔에서 카카오 로그인을 활성화해주세요.\n\n자세한 설정 방법은 KAKAO_LOGIN_SETUP.md 파일을 참고하세요.');
                } else {
                    alert('공유하려면 카카오 로그인이 필요합니다.\n\n오류: ' + errorMsg);
                }
                return;
            }
            
            // 1. 현재 책 확인
            if (!currentOpenAnime) {
                alert("공유할 책이 없습니다.");
                return;
            }
            
            const shareBtn = document.getElementById("share-book-btn");
            if (shareBtn) {
                shareBtn.disabled = true;
            }
            
            try {
                // 2. 이미 공유되어 있는지 확인
                const existingRecord = await getBookSharedRecord(currentOpenAnime);
                
                if (existingRecord) {
                    // 이미 공유되어 있으면 삭제 (공유 취소)
                    if (shareBtn) {
                        shareBtn.textContent = "취소 중...";
                    }
                    
                    const success = await deleteSharedRecordFromKV(currentOpenAnime, existingRecord.id);
                    
                    if (success) {
                        alert("공유가 취소되었습니다.");
                        if (shareBtn) {
                            shareBtn.textContent = "📚 다른 사람한테 보여주기";
                        }
                    } else {
                        alert("공유 취소에 실패했습니다.");
                        if (shareBtn) {
                            shareBtn.textContent = "📚 공유 취소";
                        }
                    }
                } else {
                    // 공유되어 있지 않으면 추가
                    // 질문+답변 수집
                    const questions = getQuestionsForTitle(currentOpenAnime);
                    if (!questions || questions.length === 0) {
                        alert("공유할 질문이 없습니다.");
                        if (shareBtn) {
                            shareBtn.disabled = false;
                        }
                        return;
                    }
                    
                    // 줄거리 가져오기
                    const overview = getOverviewForTitle(currentOpenAnime);
                    
                    // 데이터 구성
                    const bookData = {
                        title: currentOpenAnime,
                        questions: questions,
                        overview: overview
                    };
                    
                    if (shareBtn) {
                        shareBtn.textContent = "저장 중...";
                    }
                    
                    // KV에 저장
                    if (!kakaoUserId) {
                        alert("로그인 정보가 없습니다. 다시 로그인해주세요.");
                        if (shareBtn) {
                            shareBtn.disabled = false;
                            shareBtn.textContent = "📚 다른 사람한테 보여주기";
                        }
                        return;
                    }
                    
                    const success = await saveSharedRecordToKV(
                        currentOpenAnime,
                        "book",
                        bookData,
                        "kv"
                    );
                    
                    if (success) {
                        alert("책이 공유 기록에 저장되었습니다! 📚");
                        if (shareBtn) {
                            shareBtn.textContent = "📚 공유 취소";
                        }
                    } else {
                        alert("공유 기록 저장에 실패했습니다.");
                        if (shareBtn) {
                            shareBtn.textContent = "📚 다른 사람한테 보여주기";
                        }
                    }
                }
            } catch (err) {
                console.error("[공유 오류]", err);
                alert("공유 중 오류가 발생했습니다: " + (err.message || String(err)));
                if (shareBtn) {
                    shareBtn.textContent = "📚 다른 사람한테 보여주기";
                }
            } finally {
                if (shareBtn) {
                    shareBtn.disabled = false;
                }
            }
        }

        function tryInitKakao() {
            if (window.Kakao && kakaoJsKey && !window.Kakao.isInitialized()) {
                window.Kakao.init(kakaoJsKey);
            }
        }

        function onKakaoSDKLoaded() {
            tryInitKakao();
            if (window.Kakao && window.Kakao.Share) {
                kakaoSDKReady = true;
            }
        }

        function getShareLink() {
            return window.location.origin + "/";
        }

        function initKakao() {
            if (!kakaoJsKey) return false;
            if (!window.Kakao) return false;
            if (!window.Kakao.Share) return false;
            if (!window.Kakao.Share.sendDefault) return false;
            if (!window.Kakao.isInitialized()) {
                window.Kakao.init(kakaoJsKey);
            }
            return true;
        }

        function getKakaoInitErrorMsg() {
            if (!kakaoJsKey) return "API 키를 불러오지 못했습니다. 배포 환경에서 KAKAO_JS_KEY 환경변수와 /api/config 응답을 확인해 주세요.";
            return "카카오 개발자 콘솔에서 사이트 도메인(" + window.location.origin + ")을 등록해 주세요.";
        }

        function queueShareQuestionAnswerFeed() {
            requestAnimationFrame(function () {
                setTimeout(shareQuestionAnswerFeed, 0);
            });
        }

        function shareSiteFeed() {
            if (!featureAvailability.kakaoShare) {
                alert("카카오 공유 설정이 없어 사이트 공유를 사용할 수 없습니다.");
                return;
            }
            if (!kakaoSDKReady) {
                alert("카카오 SDK가 아직 준비되지 않았습니다. 잠시 후 다시 시도하세요.");
                return;
            }
            if (!initKakao()) {
                alert(getKakaoInitErrorMsg());
                return;
            }
            const linkUrl = getShareLink();
            const title = "마법사의 서고";
            const desc = "나만의 서재에 기록을 남겨보세요.";

            if (typeof window.Kakao.Share.sendDefault !== "function") {
                alert("sendDefault 함수를 찾을 수 없습니다. SDK 버전을 확인하세요.");
                return;
            }

            try {
                const shareResult = window.Kakao.Share.sendDefault({
                    objectType: "feed",
                    content: {
                        title: title,
                        description: desc,
                        imageUrl: SHARE_IMAGE_URL,
                        link: { mobileWebUrl: linkUrl, webUrl: linkUrl },
                    },
                    buttons: [{
                        title: "웹에서 보기",
                        link: { mobileWebUrl: linkUrl, webUrl: linkUrl },
                    }],
                });
                if (shareResult && typeof shareResult.then === "function") {
                    shareResult.catch(function (err) {
                        const errMsg = err?.msg || err?.message || String(err);
                        if (errMsg.includes("domain") || errMsg.includes("401") || err?.code === -401) {
                            alert("도메인 미등록 에러입니다. 카카오 개발자 콘솔에서 사이트 도메인(" + window.location.origin + ")을 등록해 주세요.");
                        } else {
                            alert("공유 실패: " + errMsg);
                        }
                    });
                }
            } catch (err) {
                alert("공유 요청 중 오류: " + (err?.message || String(err)));
            }
        }

        async function shareQuestionAnswerFeed() {
            saveCurrentAnswer();
            if (!featureAvailability.kakaoShare) {
                alert("카카오 공유 설정이 없어 질문 공유를 사용할 수 없습니다.");
                return;
            }
            if (!kakaoSDKReady) {
                alert("카카오 SDK가 아직 준비되지 않았습니다. 잠시 후 다시 시도하세요.");
                return;
            }
            if (!initKakao()) {
                alert(getKakaoInitErrorMsg());
                return;
            }
            if (!currentOpenAnime) return;
            const questions = getQuestionsForTitle(currentOpenAnime);
            const item = questions?.[currentQIndex];
            if (!item) {
                alert("공유할 질문과 답변이 없습니다.");
                return;
            }
            const q = (item.q || "").trim();
            const a = (item.a || "").trim();
            if (!q) {
                alert("공유할 질문이 없습니다.");
                return;
            }
            const titleText = `${currentOpenAnime} | ${q.length > 50 ? q.slice(0, 47) + "…" : q}`.slice(0, 200);
            const linkUrl = getShareLink();

            if (typeof window.Kakao.Share.sendDefault !== "function") {
                alert("sendDefault 함수를 찾을 수 없습니다. SDK 버전을 확인하세요.");
                return;
            }
            if (typeof html2canvas !== "function") {
                alert("이미지 생성 라이브러리를 불러올 수 없습니다.");
                return;
            }

            const shareBtn = document.getElementById("share-qa-btn");
            if (shareBtn) {
                shareBtn.disabled = true;
                shareBtn.textContent = "이미지 생성 중...";
            }

            const pageLeft = document.querySelector("#book-modal .page-left");
            if (!pageLeft) {
                alert("공유할 질문 영역을 찾을 수 없습니다.");
                if (shareBtn) { shareBtn.disabled = false; shareBtn.textContent = "💬 카카오톡 공유"; }
                return;
            }

            const deleteBtn = document.getElementById("q-delete-btn");
            const origDelDisplay = deleteBtn ? deleteBtn.style.display : "";
            if (deleteBtn) deleteBtn.style.display = "none";

            const origOverflow = pageLeft.style.overflowY;
            pageLeft.style.overflowY = "visible";

            await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });

            const elWidth = pageLeft.offsetWidth || 400;
            const elHeight = pageLeft.scrollHeight || pageLeft.offsetHeight;
            const scale = 1;

            try {
                const canvas = await html2canvas(pageLeft, {
                    width: elWidth,
                    height: elHeight,
                    scale: scale,
                    useCORS: true,
                    backgroundColor: "#e8dec9",
                    logging: false,
                });
                pageLeft.style.overflowY = origOverflow;
                if (deleteBtn) deleteBtn.style.display = origDelDisplay;

                const imageUrl = await new Promise(function (resolve, reject) {
                    canvas.toBlob(
                        function (blob) {
                            if (!blob) {
                                reject(new Error("이미지 생성 실패"));
                                return;
                            }
                            const file = new File([blob], "share.png", {
                                type: "image/png",
                                lastModified: Date.now(),
                            });
                            if (!window.Kakao?.Share?.uploadImage) {
                                resolve(SHARE_IMAGE_URL);
                                return;
                            }
                            window.Kakao.Share.uploadImage({ file: [file] })
                                .then(function (res) {
                                    resolve(res?.infos?.original?.url || SHARE_IMAGE_URL);
                                })
                                .catch(function () {
                                    resolve(SHARE_IMAGE_URL);
                                });
                        },
                        "image/png",
                        0.95
                    );
                });

                const shareResult = window.Kakao.Share.sendDefault({
                    objectType: "feed",
                    content: {
                        title: titleText,
                        description: "나만의 서재에 기록을 남겨보세요.",
                        imageUrl: imageUrl,
                        link: { mobileWebUrl: linkUrl, webUrl: linkUrl },
                    },
                    buttons: [{
                        title: "웹에서 보기",
                        link: { mobileWebUrl: linkUrl, webUrl: linkUrl },
                    }],
                });
                
                // 공유 기록 저장 (공유 창이 열리면 성공으로 간주)
                saveSharedRecordToKV(currentOpenAnime, "qa", { q, a }, "image").catch(() => {
                    // 실패해도 공유는 계속 진행
                });

                if (shareResult && typeof shareResult.then === "function") {
                    shareResult
                        .then(function () {
                            // 공유 성공 시 기록 저장 (이미 위에서 저장했지만, 성공 확인 후 재시도 가능)
                        })
                        .catch(function (err) {
                            const errMsg = err?.msg || err?.message || String(err);
                            if (errMsg.includes("domain") || errMsg.includes("401") || err?.code === -401) {
                                alert("도메인 미등록 에러입니다. 카카오 개발자 콘솔에서 사이트 도메인(" + window.location.origin + ")을 등록해 주세요.");
                            } else {
                                alert("공유 실패: " + errMsg);
                            }
                        });
                }
            } catch (err) {
                pageLeft.style.overflowY = origOverflow;
                if (deleteBtn) deleteBtn.style.display = origDelDisplay;
                alert("이미지 생성 또는 공유 중 오류: " + (err?.message || String(err)));
            } finally {
                if (shareBtn) {
                    shareBtn.disabled = false;
                    shareBtn.textContent = "💬 카카오톡 공유";
                }
            }
        }

        function shareQuestionAnswerAsLink() {
            saveCurrentAnswer();
            if (!kakaoSDKReady) {
                alert("카카오 SDK가 아직 준비되지 않았습니다.");
                return;
            }
            if (!initKakao()) {
                alert(getKakaoInitErrorMsg());
                return;
            }
            if (!currentOpenAnime) return;
            const questions = getQuestionsForTitle(currentOpenAnime);
            const item = questions?.[currentQIndex];
            if (!item) {
                alert("공유할 답변이 없습니다.");
                return;
            }
            const a = (item.a || "").trim();
            if (!a) {
                alert("공유할 답변을 먼저 입력해 주세요.");
                return;
            }
            const base = window.location.origin + "/share.html";
            const shareUrl = base + "?title=" + encodeURIComponent(currentOpenAnime) + "&a=" + encodeURIComponent(a);
            if (shareUrl.length > 1800) {
                alert("내용이 너무 길어 링크 공유가 어렵습니다. 이미지로 공유해 주세요.");
                return;
            }
            if (!window.Kakao.Share.sendScrap) {
                alert("스크랩 공유를 지원하지 않는 환경입니다.");
                return;
            }
            try {
                const q = (item.q || "").trim();
                window.Kakao.Share.sendScrap({ requestUrl: shareUrl });
                
                // 공유 기록 저장 (공유 창이 열리면 성공으로 간주)
                saveSharedRecordToKV(currentOpenAnime, "qa", { q, a }, "link").catch(() => {
                    // 실패해도 공유는 계속 진행
                });
            } catch (err) {
                alert("공유 중 오류: " + (err?.message || String(err)));
            }
        }

        window.addEventListener("load", function () {
            fetch(window.location.origin + "/api/config")
                .then(function (r) {
                    if (!r.ok) throw new Error("config " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    kakaoJsKey = (data.kakaoJsKey || "").trim();
                    applyFeatureAvailability(data.features || {});
                    tryInitKakao();
                    if (window.Kakao && window.Kakao.Share) kakaoSDKReady = true;
                    
                    // 로그인 상태 확인
                    if (window.Kakao && window.Kakao.Auth) {
                        // 저장된 사용자 ID 확인
                        const savedUserId = localStorage.getItem('kakao_user_id');
                        if (savedUserId) {
                            kakaoUserId = savedUserId;
                        }
                        // 토큰 유효성 확인
                        checkKakaoLogin();
                    }
                })
                .catch(function (e) {
                    console.warn("[카카오] 설정 로드 실패:", e);
                    applyFeatureAvailability({
                        tmdbSearch: false,
                        aiQuestions: false,
                        kakaoShare: false,
                        kakaoLogin: false,
                        sharedRecords: false
                    });
                });
            if (window.Kakao) onKakaoSDKLoaded();
        });
    </script>
</body>
</html>
