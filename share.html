<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-3543643898299039">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공유된 서고 - 마법사의 서고</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.9/kakao.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Nanum+Brush+Script&display=swap');

        :root {
            --ancient-gold: #c5a059;
            --stone-medium: #1a1a1f;
            --stone-dark: #0a0a0c;
            --leather-rich: #3d2b1f;
            --parchment: #f2e8cf;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            background: radial-gradient(circle at center, #1a1a24 0%, #08080a 100%);
            color: #e2e2e2;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. 배경 거대 책 더미 */
        .library-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.5;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 0;
            pointer-events: none;
        }

        .book-stack {
            width: 130px;
            display: flex;
            flex-direction: column-reverse;
            margin: 0 -20px; 
        }

        .bg-book {
            height: 12px;
            margin-bottom: 2px;
            background: #1e1e24;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            border-left: 8px solid rgba(0,0,0,0.5); 
            width: 100%;
            border-radius: 1px;
        }

        /* 2. 고대 도서관 채광 및 마법 효과 */
        .god-rays {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -5%, rgba(197, 160, 89, 0.25) 0%, transparent 85%);
            pointer-events: none;
            z-index: 1;
        }

        .magic-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 100px 100px;
            opacity: 0.1;
            animation: moveDust 45s linear infinite;
            z-index: 0;
        }

        @keyframes moveDust {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        /* 3. 3단 선반 레이아웃 */
        .shelf-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-bottom: 80px;
        }

        .shelf-row {
            position: relative;
            padding: 0 20px;
        }

        .books-wrapper {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            min-height: 240px;
            padding-bottom: 2px;
            flex-wrap: nowrap;
            overflow-x: visible;
        }

        .stone-stair {
            height: 28px;
            background: linear-gradient(to bottom, #32323a, #08080a);
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
        }

        /* 4. 마도서(Grimoire) 디자인 */
        .grimoire {
            height: 190px;
            position: relative;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-style: preserve-3d;
            border-radius: 3px 6px 6px 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-lr;
            text-orientation: upright;
            direction: ltr;
            font-family: 'Nanum Brush Script', cursive;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            box-shadow: -10px 10px 25px rgba(0,0,0,0.7);
            border-left: 6px solid rgba(0,0,0,0.3);
            flex-shrink: 0;
            text-align: center;
            word-break: keep-all;
            line-height: 1.4;
        }

        .grimoire::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            background: linear-gradient(to bottom, 
                transparent 15%, rgba(0,0,0,0.3) 15.5%, rgba(0,0,0,0.3) 17%, transparent 17.5%,
                transparent 45%, rgba(0,0,0,0.4) 45.5%, rgba(0,0,0,0.4) 47%, transparent 47.5%,
                transparent 80%, rgba(0,0,0,0.4) 80.5%, rgba(0,0,0,0.4) 82%, transparent 82.5%
            );
        }

        .grimoire-decoration {
            position: absolute;
            top: 10px; bottom: 10px; left: 10px; right: 10px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            pointer-events: none;
        }

        .grimoire:hover {
            transform: translateY(-30px) rotateY(-15deg) scale(1.1);
            filter: brightness(1.2);
            box-shadow: 20px 20px 40px rgba(0,0,0,0.9);
            z-index: 50;
        }

        /* 책 추가 애니메이션 */
        .book-appear {
            animation: bookAppear 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes bookAppear {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
                filter: brightness(1.5);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        /* 5. 3D 북 모달 */
        .book-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(25px);
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            perspective: 2000px;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .open-book {
            width: 100%;
            max-width: 900px;
            height: 80vh;
            max-height: 600px;
            display: flex;
            position: relative;
            transform-style: preserve-3d;
            animation: bookUnfold 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
        }

        @keyframes bookUnfold {
            0% { transform: scale(0.8) rotateY(-45deg); opacity: 0; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        .book-page {
            flex: 1;
            background: #e8dec9;
            color: #2d241e;
            padding: 25px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .page-left {
            border-radius: 10px 0 0 10px;
            border-right: 1px solid rgba(0,0,0,0.1);
            background-image: linear-gradient(to right, #d4c4a8, #e8dec9 15%);
        }

        .page-right {
            border-radius: 0 10px 10px 0;
            background-image: linear-gradient(to left, #d4c4a8, #e8dec9 15%);
        }

        .book-binding {
            position: absolute;
            left: 50%; top: 0; bottom: 0;
            width: 30px;
            background: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.2));
            transform: translateX(-50%);
            z-index: 10;
        }

        /* 6. 모바일 대응 */
        @media (max-width: 768px) {
            .open-book {
                flex-direction: column;
                height: 90vh;
                max-height: none;
            }
            .book-binding {
                width: 100%;
                height: 20px;
                left: 0; top: 50%;
                transform: translateY(-50%);
                background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.1));
            }
            .page-left { border-radius: 10px 10px 0 0; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.1); }
            .page-right { border-radius: 0 0 10px 10px; }
            .grimoire { height: 160px; font-size: 1rem; }
            .books-wrapper { gap: 5px; }
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            body { padding: 0.75rem; padding-top: 1rem; }
            main { padding: 0 0.5rem; }
            .shelf-container { gap: 24px; margin-bottom: 48px; }
            .shelf-row { padding: 0 8px; }
            .books-wrapper { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
            .books-wrapper::-webkit-scrollbar { height: 4px; }
            .stone-stair { height: 20px; }
            .book-page { padding: 16px; }
            #book-title { font-size: 1.25rem; margin-bottom: 1rem; }
            #q-text { font-size: 0.95rem; padding-left: 1rem; }
            .mana-input { padding: 8px; font-size: 14px; min-height: 80px; }
            .a-radio-option { padding: 12px 14px; }
            .a-radio-option span { font-size: 14px; }
            .ancient-slab { padding: 24px 20px; max-height: 85vh; }
        }
        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            main > div:first-child { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
            main > div:first-child h3 { font-size: 0.9rem; letter-spacing: 0.1em; }
            .gold-btn { padding: 6px 12px; font-size: 9px; }
            .open-book { padding: 0 12px; }
        }

        .gold-btn {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--ancient-gold);
            color: var(--ancient-gold);
            padding: 8px 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .gold-btn:hover:not(:disabled) {
            background: var(--ancient-gold);
            color: #000;
            box-shadow: 0 0 20px var(--ancient-gold);
        }

        .gold-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mana-input {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(54, 36, 26, 0.2);
            border-radius: 4px;
            color: #2d241e;
            padding: 10px;
            width: 100%;
            font-family: 'serif';
            resize: none;
            outline: none;
        }

        .mana-input:disabled {
            background: rgba(0, 0, 0, 0.02);
            color: rgba(45, 36, 30, 0.4);
            cursor: not-allowed;
        }

        .a-radio-wrap {
            display: none;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .a-radio-wrap.visible { display: flex; }
        .a-radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(54, 36, 26, 0.15);
            border-radius: 8px;
            cursor: default;
            transition: all 0.25s ease;
            border-left: 3px solid transparent;
        }
        .a-radio-option.checked {
            background: rgba(197, 160, 89, 0.08);
            border-left-color: var(--ancient-gold);
            box-shadow: 0 0 0 1px rgba(197, 160, 89, 0.2);
        }
        .a-radio-option input {
            width: 20px;
            height: 20px;
            accent-color: var(--ancient-gold);
            cursor: default;
            flex-shrink: 0;
            pointer-events: none;
        }
        .a-radio-option span {
            color: #2d241e;
            font-size: 15px;
            line-height: 1.5;
            flex: 1;
        }

        /* 작품 선택 모달 */
        .modal-blur {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(20px);
            background: rgba(0,0,0,0.85);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ancient-slab {
            background: rgba(20, 20, 28, 0.95);
            border: 1px solid var(--ancient-gold);
            box-shadow: 0 30px 60px rgba(0,0,0,1);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .title-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(197, 160, 89, 0.2);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .title-list-item:hover {
            background: rgba(197, 160, 89, 0.1);
            border-color: var(--ancient-gold);
            transform: translateX(4px);
        }

        .title-list-item-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--ancient-gold);
        }

        .title-list-item-count {
            font-size: 0.9rem;
            color: rgba(226, 226, 226, 0.6);
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }

        .tab-button {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--ancient-gold);
            color: var(--ancient-gold);
            padding: 10px 20px;
            margin-right: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: var(--ancient-gold);
            color: #000;
        }

        .tab-button:hover {
            background: rgba(197, 160, 89, 0.2);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--ancient-gold);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(226, 226, 226, 0.6);
        }
    </style>
</head>
<body class="p-4 md:p-10 pt-10">
    <div class="library-bg" id="bg-stacks"></div>
    <div class="god-rays"></div>
    <div class="magic-dust"></div>

    <main class="max-w-6xl mx-auto relative z-10">
        <!-- 상단 헤더 -->
        <div class="flex flex-wrap items-center justify-between gap-6 mb-12 px-4">
            <div class="flex items-center gap-6">
                <span class="text-4xl opacity-50">📚</span>
                <h1 class="text-xl md:text-2xl font-bold tracking-[0.2em] text-stone-400 uppercase">공유된 서고</h1>
                <span id="book-count" class="text-[10px] bg-stone-900 text-stone-500 px-3 py-1 border border-stone-800 font-bold uppercase tracking-widest">Volumes: 0</span>
            </div>
            <div class="flex gap-2">
                <a href="/" class="gold-btn text-[10px] tracking-widest px-4 py-2 no-underline">🏠 홈으로</a>
            </div>
        </div>

        <!-- 탭 버튼 -->
        <div class="mb-8 px-4 flex flex-wrap">
            <button class="tab-button active" onclick="switchTab('random')" id="tab-random">🎲 랜덤 책 보기</button>
            <button class="tab-button" onclick="switchTab('by-title')" id="tab-by-title">📖 작품별 보기</button>
            <button class="tab-button" onclick="switchTab('my-books')" id="tab-my-books">⭐ 내가 공유한 책</button>
        </div>

        <!-- 3단 서재 선반 구역 -->
        <div class="shelf-container">
            <div class="shelf-row">
                <div id="shelf-1" class="books-wrapper"></div>
                <div class="stone-stair"></div>
            </div>
            <div class="shelf-row">
                <div id="shelf-2" class="books-wrapper"></div>
                <div class="stone-stair"></div>
            </div>
            <div class="shelf-row">
                <div id="shelf-3" class="books-wrapper"></div>
                <div class="stone-stair"></div>
            </div>
        </div>
    </main>

    <!-- 마도서 펼치기 모달 (보기 전용) -->
    <div id="book-modal" class="book-overlay" onclick="closeGrimoire()">
        <div class="open-book" onclick="event.stopPropagation()">
            <div class="book-binding"></div>
            <div class="book-page page-left flex flex-col">
                <h3 id="book-title" class="text-2xl md:text-3xl font-bold mb-6 font-serif text-[#36241a] border-b border-[#36241a]/10 pb-4">작품명</h3>
                <div class="flex-1 flex flex-col justify-center">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-[#36241a]/40 font-bold mb-4 italic">The Sealed Question</div>
                    <div id="q-text" class="text-lg font-bold border-l-4 border-[#c5a059]/50 pl-6 py-2 italic text-[#4a342e] pr-12">질문이 표시됩니다.</div>
                </div>
                <div class="mt-8 flex items-center justify-center gap-2 flex-wrap">
                    <button onclick="prevQuestion()" class="p-2 border border-[#36241a]/20 hover:bg-[#36241a]/5 rounded">◀</button>
                    <span id="q-index" class="text-[10px] font-bold text-[#36241a]/50 flex items-center px-1">1 / 1</span>
                    <button onclick="nextQuestion()" class="p-2 border border-[#36241a]/20 hover:bg-[#36241a]/5 rounded">▶</button>
                </div>
            </div>
            <div class="book-page page-right flex flex-col">
                <div class="absolute top-4 right-6 text-3xl cursor-pointer opacity-30 hover:opacity-100" onclick="closeGrimoire()">×</div>
                <div class="flex-1 flex flex-col mt-8">
                    <div class="text-[10px] uppercase tracking-[0.2em] text-[#36241a]/40 font-bold mb-4 italic">My Arcane Record</div>
                    <div id="a-container" class="flex-1 flex flex-col min-h-0">
                        <textarea id="a-input" class="mana-input flex-1" placeholder="답변이 표시됩니다..." disabled readonly></textarea>
                        <div id="a-radio-wrap" class="a-radio-wrap"></div>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3 items-center">
                    <button onclick="closeGrimoire()" class="gold-btn text-[10px] px-6 py-2">닫기</button>
                </div>
                <div class="mt-4 pt-4 border-t border-[#36241a]/5 flex justify-between items-center text-[9px] text-[#36241a]/40 font-bold tracking-[0.2em] uppercase">
                    <span>Fragment #ARC-9</span>
                    <span id="m-date">FEB 15, 2026</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 작품 선택 팝업 모달 -->
    <div id="title-select-modal" class="modal-blur" onclick="closeTitleSelectModal()">
        <div class="ancient-slab" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-yellow-600 tracking-widest uppercase">작품 선택</h3>
                <button onclick="closeTitleSelectModal()" class="text-2xl text-stone-600 hover:text-stone-400 cursor-pointer">×</button>
            </div>
            <div id="title-list" class="scrollbar-hide" style="max-height: 60vh; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let kakaoUserId = null;
        let currentTab = 'random';
        let allTitles = [];
        let currentRecords = []; // 현재 표시 중인 책들
        let currentRecord = null; // 현재 모달에 표시 중인 책
        let currentQIndex = 0;
        let requestedSlug = "";
        let metricsEnabled = false;
        let featureAvailability = {
            sharedRecords: true,
            kakaoLogin: true
        };

        function setTabAvailability(tabId, enabled, disabledTitle) {
            const button = document.getElementById(tabId);
            if (!button) return;

            if (!button.dataset.originalTitle) {
                button.dataset.originalTitle = button.title || "";
            }

            button.disabled = !enabled;
            button.style.opacity = enabled ? "" : "0.5";
            button.title = enabled ? button.dataset.originalTitle : disabledTitle;
        }

        function applyFeatureAvailability(features = {}) {
            featureAvailability = {
                ...featureAvailability,
                ...features
            };

            setTabAvailability("tab-random", featureAvailability.sharedRecords, "공유 저장소 설정이 없어 공유된 책을 볼 수 없습니다.");
            setTabAvailability("tab-by-title", featureAvailability.sharedRecords, "공유 저장소 설정이 없어 작품별 보기를 사용할 수 없습니다.");
            setTabAvailability(
                "tab-my-books",
                featureAvailability.sharedRecords && featureAvailability.kakaoLogin,
                !featureAvailability.sharedRecords
                    ? "공유 저장소 설정이 없어 내가 공유한 책을 볼 수 없습니다."
                    : "카카오 로그인 설정이 없어 내가 공유한 책을 사용할 수 없습니다."
            );
        }

        function showSharedRecordsUnavailable() {
            showEmpty('공유 저장소가 아직 설정되지 않았습니다.<br><br>관리자가 KV 또는 Redis를 연결하면 공유된 서고를 볼 수 있습니다.');
        }

        function getAnonymousId() {
            const existing = localStorage.getItem("magic_house_anonymous_id");
            if (existing) return existing;

            const nextId = "anon_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
            localStorage.setItem("magic_house_anonymous_id", nextId);
            return nextId;
        }

        function trackMetric(eventName, properties = {}) {
            const payload = {
                event: eventName,
                page: window.location.pathname,
                anonymousId: getAnonymousId(),
                properties,
            };
            const body = JSON.stringify(payload);

            if (navigator.sendBeacon) {
                try {
                    const blob = new Blob([body], { type: "application/json" });
                    navigator.sendBeacon(window.location.origin + "/api/metrics", blob);
                    return;
                } catch (_) {}
            }

            fetch(window.location.origin + "/api/metrics", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body,
                keepalive: true,
            }).catch(() => {});
        }

        function escapeJsString(text) {
            return String(text || "")
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");
        }

        function focusQuestionFromParams(record) {
            const params = new URLSearchParams(window.location.search);
            const queryQuestion = params.get("q");
            const queryAnswer = params.get("a");
            const questions = record?.data?.questions || [];

            if (!queryQuestion && !queryAnswer) {
                currentQIndex = 0;
                return;
            }

            const foundIndex = questions.findIndex((item) => {
                const sameQuestion = !queryQuestion || (item.q || "").trim() === queryQuestion.trim();
                const sameAnswer = !queryAnswer || (item.a || "").trim() === queryAnswer.trim();
                return sameQuestion && sameAnswer;
            });

            currentQIndex = foundIndex >= 0 ? foundIndex : 0;
        }

        // 배경 책 더미 생성
        function createBgStacks() {
            const container = document.getElementById('bg-stacks');
            if(!container) return;
            const stackCount = 14; 
            for(let i = 0; i < stackCount; i++) {
                const stack = document.createElement('div');
                stack.className = 'book-stack';
                const height = Math.floor(Math.random() * 30) + 15; 
                for(let j = 0; j < height; j++) {
                    const book = document.createElement('div');
                    book.className = 'bg-book';
                    book.style.width = (75 + Math.random() * 45) + '%';
                    const hue = 210 + Math.random() * 40;
                    book.style.backgroundColor = `hsl(${hue}, 15%, ${12 + Math.random() * 15}%)`;
                    stack.appendChild(book);
                }
                container.appendChild(stack);
            }
        }

        // 카카오 로그인 확인
        async function checkKakaoLogin() {
            const savedUserId = localStorage.getItem('kakao_user_id');
            if (savedUserId) {
                kakaoUserId = savedUserId;
                return true;
            }
            return false;
        }

        // 질문 수에 따른 책 두께 계산
        const BASE_BOOK_WIDTH = 60;
        const QUESTION_WIDTH_INCREMENT = 6;
        function getBookWidthForRecord(record) {
            const bookData = record.data || {};
            const questions = bookData.questions || [];
            const count = questions.length;
            return BASE_BOOK_WIDTH + count * QUESTION_WIDTH_INCREMENT;
        }

        // 선반 초기화
        function clearShelves() {
            ['shelf-1', 'shelf-2', 'shelf-3'].forEach(shelfId => {
                const shelf = document.getElementById(shelfId);
                if (shelf) {
                    shelf.innerHTML = '';
                }
            });
        }

        // 책을 선반에 추가하는 함수
        function addBookToNextAvailableShelf(record) {
            const bookWidth = getBookWidthForRecord(record);
            let currentShelfId = 'shelf-1';
            
            // 사용 가능한 선반 찾기
            for (let i = 1; i <= 3; i++) {
                const shelfId = `shelf-${i}`;
                const shelf = document.getElementById(shelfId);
                if (!shelf) continue;
                
                const shelfWidth = shelf.offsetWidth;
                const books = shelf.querySelectorAll('.grimoire');
                let booksTotalWidth = 0;
                books.forEach(book => {
                    booksTotalWidth += book.offsetWidth;
                });
                
                const gap = 6;
                const gapTotal = books.length > 0 ? gap * books.length : 0;
                const availableWidth = shelfWidth - booksTotalWidth - gapTotal;
                
                if (availableWidth >= bookWidth) {
                    currentShelfId = shelfId;
                    break;
                }
            }
            
            createSharedBookElement(record, currentShelfId);
        }

        // 공유된 책 요소 생성
        function createSharedBookElement(record, shelfId) {
            const shelf = document.getElementById(shelfId);
            if (!shelf) return;
            
            const bookData = record.data || {};
            const title = bookData.title || record.title || '제목 없음';
            const questions = bookData.questions || [];
            
            const colors = ['#4e1a1a', '#1a2b4a', '#1b3b2a', '#5d4037', '#281b3d', '#1c1c1c', '#3e2723', '#2c3e50'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const fixedHeight = 190;
            const fixedWidth = getBookWidthForRecord(record);

            const newBook = document.createElement('div');
            newBook.className = 'grimoire book-appear';
            newBook.style.backgroundColor = randomColor;
            newBook.style.height = `${fixedHeight}px`;
            newBook.style.width = `${fixedWidth}px`;
            newBook.innerHTML = `<div class="grimoire-decoration"></div>${escapeHtml(title)}`;
            newBook.onclick = () => openSharedBook(record);
            
            shelf.appendChild(newBook);
            updateVolumeCount();
        }

        // 공유된 책 모달 열기 (보기 전용)
        function openSharedBook(record) {
            currentRecord = record;
            focusQuestionFromParams(record);
            
            const bookData = record.data || {};
            document.getElementById('book-title').innerText = bookData.title || record.title || '제목 없음';
            updateSharedBookContent();
            document.getElementById('book-modal').style.display = 'flex';
            trackMetric('shared_book_opened', {
                title: bookData.title || record.title || '제목 없음',
                slug: record.slug || requestedSlug || '',
            });
        }

        // 공유된 책 모달 내용 업데이트 (보기 전용)
        function updateSharedBookContent() {
            if (!currentRecord) return;
            
            const bookData = currentRecord.data || {};
            const questions = bookData.questions || [];
            const hasQuestions = questions && questions.length > 0;
            
            const textarea = document.getElementById('a-input');
            const radioWrap = document.getElementById('a-radio-wrap');
            
            if (!hasQuestions || currentQIndex >= questions.length) {
                document.getElementById('q-text').innerText = "질문이 없습니다.";
                textarea.value = "";
                document.getElementById('q-index').innerText = "0 / 0";
                textarea.style.display = "";
                if (radioWrap) { radioWrap.classList.remove("visible"); radioWrap.innerHTML = ""; }
                return;
            }
            
            const item = questions[currentQIndex];
            const hasOptions = item.options && Array.isArray(item.options) && item.options.length > 0;
            
            document.getElementById('q-text').innerText = item.q || '';
            document.getElementById('q-index').innerText = `${currentQIndex + 1} / ${questions.length}`;
            
            if (hasOptions) {
                textarea.style.display = "none";
                radioWrap.classList.add("visible");
                radioWrap.innerHTML = "";
                const savedVal = item.a || "";
                item.options.forEach((opt) => {
                    const val = String(opt);
                    const label = document.createElement("label");
                    label.className = "a-radio-option" + (savedVal === val ? " checked" : "");
                    const input = document.createElement("input");
                    input.type = "radio";
                    input.name = "a-radio-choice-view";
                    input.value = val;
                    input.checked = savedVal === val;
                    input.disabled = true;
                    const span = document.createElement("span");
                    span.textContent = val;
                    label.appendChild(input);
                    label.appendChild(span);
                    radioWrap.appendChild(label);
                });
            } else {
                textarea.style.display = "";
                textarea.value = item.a || "";
                radioWrap.classList.remove("visible");
                radioWrap.innerHTML = "";
            }
        }

        function prevQuestion() {
            if (!currentRecord) return;
            const bookData = currentRecord.data || {};
            const questions = bookData.questions || [];
            if (currentQIndex > 0) {
                currentQIndex--;
                updateSharedBookContent();
            }
        }

        function nextQuestion() {
            if (!currentRecord) return;
            const bookData = currentRecord.data || {};
            const questions = bookData.questions || [];
            if (currentQIndex < questions.length - 1) {
                currentQIndex++;
                updateSharedBookContent();
            }
        }

        function closeGrimoire() {
            document.getElementById('book-modal').style.display = 'none';
            currentRecord = null;
            currentQIndex = 0;
        }

        // 책 개수 업데이트
        function updateVolumeCount() {
            const count = document.querySelectorAll('.grimoire').length;
            document.getElementById('book-count').innerText = `Volumes: ${count}`;
        }

        // 탭 전환
        function switchTab(tab) {
            if (!featureAvailability.sharedRecords) {
                showSharedRecordsUnavailable();
                return;
            }

            if (tab === 'my-books' && !featureAvailability.kakaoLogin) {
                showEmpty('카카오 로그인 설정이 없어 내가 공유한 책을 사용할 수 없습니다.<br><br><a href="/" class="gold-btn inline-block">홈으로 가기</a>');
                return;
            }

            currentTab = tab;
            trackMetric('shared_library_tab_switched', { tab });
            
            // 탭 버튼 활성화
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            // 콘텐츠 로드
            if (tab === 'random') {
                loadRandomBooks();
            } else if (tab === 'by-title') {
                openTitleSelectModal();
            } else if (tab === 'my-books') {
                loadMyBooks();
            }
        }

        // 랜덤 책 보기
        async function loadRandomBooks() {
            if (!featureAvailability.sharedRecords) {
                showSharedRecordsUnavailable();
                return;
            }

            clearShelves();
            updateVolumeCount();
            
            try {
                const res = await fetch(`${API_BASE}/api/shared-records`);
                const data = await res.json();
                
                if (!data.records || data.records.length === 0) {
                    showEmpty('공유된 책이 없습니다.');
                    return;
                }
                
                const bookRecords = data.records.filter(r => r.type === 'book');
                if (bookRecords.length === 0) {
                    showEmpty('공유된 책이 없습니다.');
                    return;
                }
                
                // 랜덤으로 여러 개 선택 (최대 20개)
                const shuffled = [...bookRecords].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, Math.min(20, shuffled.length));
                
                currentRecords = selected;
                selected.forEach(record => {
                    addBookToNextAvailableShelf(record);
                });
            } catch (err) {
                console.error('랜덤 책 로드 실패:', err);
            }
        }

        // 작품 선택 모달 열기
        async function openTitleSelectModal() {
            if (!featureAvailability.sharedRecords) {
                showSharedRecordsUnavailable();
                return;
            }

            const modal = document.getElementById('title-select-modal');
            const titleList = document.getElementById('title-list');
            titleList.innerHTML = '<div class="loading">작품 목록을 불러오는 중...</div>';
            modal.style.display = 'flex';
            
            try {
                const res = await fetch(`${API_BASE}/api/shared-records/titles`);
                const data = await res.json();
                
                if (!data.titles || data.titles.length === 0) {
                    titleList.innerHTML = '<div class="empty-state">공유된 작품이 없습니다.</div>';
                    return;
                }
                
                allTitles = data.titles;
                let html = '';
                data.titles.forEach(item => {
                    html += `<div class="title-list-item" onclick="selectTitleBySlug('${escapeJsString(item.slug || "")}', '${escapeJsString(item.title)}')">`;
                    html += `<div class="title-list-item-title">${escapeHtml(item.title)}</div>`;
                    html += `<div class="title-list-item-count">${item.count}개</div>`;
                    html += '</div>';
                });
                titleList.innerHTML = html;
            } catch (err) {
                console.error('작품 목록 로드 실패:', err);
                titleList.innerHTML = '<div class="empty-state">작품 목록을 불러오는 중 오류가 발생했습니다.</div>';
            }
        }

        function closeTitleSelectModal() {
            document.getElementById('title-select-modal').style.display = 'none';
        }

        // 작품 선택
        async function selectTitleBySlug(slug, titleFallback = '') {
            if (!featureAvailability.sharedRecords) {
                showSharedRecordsUnavailable();
                return;
            }

            closeTitleSelectModal();
            clearShelves();
            updateVolumeCount();
            
            try {
                const qs = slug
                    ? `slug=${encodeURIComponent(slug)}`
                    : `title=${encodeURIComponent(titleFallback)}`;
                const res = await fetch(`${API_BASE}/api/shared-records?${qs}`);
                const data = await res.json();
                
                if (!data.records || data.records.length === 0) {
                    showEmpty('이 작품에 대한 공유 기록이 없습니다.');
                    return;
                }
                
                const bookRecords = data.records.filter(r => r.type === 'book');
                if (bookRecords.length === 0) {
                    showEmpty('이 작품에 대한 공유된 책이 없습니다.');
                    return;
                }
                
                bookRecords.sort((a, b) => new Date(b.sharedAt) - new Date(a.sharedAt));
                currentRecords = bookRecords;
                
                bookRecords.forEach(record => {
                    addBookToNextAvailableShelf(record);
                });

                if (requestedSlug && bookRecords.length > 0) {
                    openSharedBook(bookRecords[0]);
                }
            } catch (err) {
                console.error('작품별 책 로드 실패:', err);
            }
        }

        // 내가 공유한 책 로드
        async function loadMyBooks() {
            if (!featureAvailability.sharedRecords) {
                showSharedRecordsUnavailable();
                return;
            }

            if (!featureAvailability.kakaoLogin) {
                showEmpty('카카오 로그인 설정이 없어 내가 공유한 책을 사용할 수 없습니다.<br><br><a href="/" class="gold-btn inline-block">홈으로 가기</a>');
                return;
            }

            clearShelves();
            updateVolumeCount();
            
            const isLoggedIn = await checkKakaoLogin();
            if (!isLoggedIn) {
                showEmpty('내가 공유한 책을 보려면 카카오 로그인이 필요합니다.<br><br><a href="/" class="gold-btn inline-block">홈으로 가기</a>');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/shared-records`);
                const data = await res.json();
                
                if (!data.records || data.records.length === 0) {
                    showEmpty('공유한 책이 없습니다.');
                    return;
                }
                
                const myBookRecords = data.records.filter(r => r.type === 'book' && r.userId === kakaoUserId);
                if (myBookRecords.length === 0) {
                    showEmpty('공유한 책이 없습니다.');
                    return;
                }
                
                myBookRecords.sort((a, b) => new Date(b.sharedAt) - new Date(a.sharedAt));
                currentRecords = myBookRecords;
                
                myBookRecords.forEach(record => {
                    addBookToNextAvailableShelf(record);
                });
            } catch (err) {
                console.error('내 책 로드 실패:', err);
            }
        }

        // 빈 상태 표시
        function showEmpty(message) {
            clearShelves();
            const shelf1 = document.getElementById('shelf-1');
            if (shelf1) {
                shelf1.innerHTML = `<div class="empty-state" style="width: 100%; padding: 60px 20px;">${message}</div>`;
            }
            updateVolumeCount();
        }

        // HTML 이스케이프
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 초기화
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            requestedSlug = params.get("slug") || "";
            createBgStacks();
            fetch(window.location.origin + "/api/config")
                .then(function (r) {
                    if (!r.ok) throw new Error("config " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    applyFeatureAvailability(data.features || {});
                    metricsEnabled = !!data.metricsEnabled;
                    checkKakaoLogin();
                    if (!featureAvailability.sharedRecords) {
                        showSharedRecordsUnavailable();
                        return;
                    }
                    trackMetric('shared_library_loaded', {
                        requestedSlug,
                        sharedRecords: featureAvailability.sharedRecords,
                        metricsEnabled,
                    });
                    if (requestedSlug) {
                        selectTitleBySlug(requestedSlug);
                        return;
                    }
                    loadRandomBooks();
                })
                .catch(function () {
                    applyFeatureAvailability({
                        sharedRecords: false,
                        kakaoLogin: false
                    });
                    showSharedRecordsUnavailable();
                });
        });
    </script>
